[project]
name = "sql2relational"
version = "0.1.0"
description = "Translate SQL statements to relational algebra, as Unicode or LaTeX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ej Orr", email = "ejorr@uvm.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "sqlglot>=30.30.0",
]

[project.scripts]
sql2relational = "sql2relational:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
